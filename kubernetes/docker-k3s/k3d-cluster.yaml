# k3d cluster config for the CDA Chat lab.
# Creates a local multi-node Kubernetes (k3s) cluster running in Docker.
# Node roles are labeled by scripts/k3d-up.sh to match the manifest selectors.
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: cda-chat
servers: 1
agents: 4
ports:
  # Map host port 8080 to the nginx NodePort (30080) via k3d's load balancer,
  # matching the Vagrant lab's forwarded port.
  - port: 8080:30080
    nodeFilters:
      - loadbalancer
options:
  k3d:
    wait: true
    timeout: "180s"
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: true
