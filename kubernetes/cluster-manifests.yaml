---
# 1.1 Credentials shared by MariaDB and the chat server
# secrets SHOULD changed for safety on commits
apiVersion: v1
kind: Secret
metadata:
  name: chat-db-credentials
type: Opaque
stringData:
  root-password: "secretpassword-owo"
  database: "chatapp"
  username: "chat"
  password: "chatpassword"
---
# 1.2 Initial database schema
# The official MariaDB image executes every file in
# /docker-entrypoint-initdb.d/ ONLY when the data directory is empty, i.e. the
# first time the pod starts with a fresh PVC. The entrypoint runs this file
# with `--database="$MYSQL_DATABASE"`, so it does not need a USE statement.
# All statements are idempotent; the Node app keeps an equivalent fallback in
# src/chat-server/lib/db.js for local development.
# ==========================
# Description taken from the mariadb official documentation btw
apiVersion: v1
kind: ConfigMap
metadata:
  name: mariadb-init
data:
  01-schema.sql: |
    CREATE TABLE IF NOT EXISTS rooms (
      id INT UNSIGNED NOT NULL AUTO_INCREMENT,
      name VARCHAR(64) NOT NULL,
      created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
      PRIMARY KEY (id),
      UNIQUE KEY uq_rooms_name (name)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;

    CREATE TABLE IF NOT EXISTS messages (
      id BIGINT UNSIGNED NOT NULL AUTO_INCREMENT,
      room_id INT UNSIGNED NOT NULL,
      username VARCHAR(64) NOT NULL,
      body TEXT NOT NULL,
      created_at TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP(3),
      PRIMARY KEY (id),
      KEY idx_messages_room_id (room_id, id),
      CONSTRAINT fk_messages_room FOREIGN KEY (room_id) REFERENCES rooms (id) ON DELETE CASCADE
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;

    INSERT INTO rooms (name) VALUES ('general')
      ON DUPLICATE KEY UPDATE name = name;

    CREATE TABLE IF NOT EXISTS profiles (
      username VARCHAR(64) NOT NULL,
      avatar VARCHAR(32) NOT NULL DEFAULT '',
      color VARCHAR(16) NOT NULL DEFAULT '',
      updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
      PRIMARY KEY (username)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;
---
# 1.3 Persistent storage for the database
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mariadb-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
# 1.4 MariaDB Deployment on DB Worker
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb
spec:
  replicas: 1
  # A single ReadWriteOnce volume must never be attached to two pods.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
    spec:
      nodeSelector:
        role: db
      containers:
      - name: mariadb
        image: mariadb:11.4
        imagePullPolicy: IfNotPresent
        args:
        - "--character-set-server=utf8mb4"
        - "--collation-server=utf8mb4_unicode_ci"
        ports:
        - name: mysql
          containerPort: 3306
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: chat-db-credentials
              key: root-password
        - name: MYSQL_DATABASE
          valueFrom:
            secretKeyRef:
              name: chat-db-credentials
              key: database
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              name: chat-db-credentials
              key: username
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: chat-db-credentials
              key: password
        volumeMounts:
        - name: data
          mountPath: /var/lib/mysql
        - name: init
          mountPath: /docker-entrypoint-initdb.d
          readOnly: true
        readinessProbe:
          exec:
            command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        livenessProbe:
          exec:
            command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
          initialDelaySeconds: 60
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 5
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: "1"
            memory: 384Mi
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: mariadb-data
      - name: init
        configMap:
          name: mariadb-init
---
# 1.5 MariaDB Service (reachable as mariadb-service:3306)
apiVersion: v1
kind: Service
metadata:
  name: mariadb-service
spec:
  selector:
    app: mariadb
  ports:
  - name: mysql
    port: 3306
    targetPort: mysql
---
# 2.1 Chat Server Deployment on the autoscaling app worker
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-server
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: chat-server
  template:
    metadata:
      labels:
        app: chat-server
      annotations:
        # Prometheus scrapes the dedicated metrics port, which is not exposed
        # through the chat Service or nginx.
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
        prometheus.io/path: "/metrics"
    spec:
      # The lab has one dedicated app worker with the preloaded image. The
      # replicas created by the HPA stay there; the fixed edge/stateful pods
      # keep their own node labels.
      nodeSelector:
        role: chat
      terminationGracePeriodSeconds: 30
      containers:
      - name: chat
        image: chat-server:latest # build it locally and import it into the chat worker
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080 # WebUI + REST + WebSocket
        - name: metrics
          containerPort: 9091 # Prometheus only; not in the Service
        env:
        - name: PORT
          value: "8080"
        - name: METRICS_PORT
          value: "9091"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NATS_URL
          value: "nats://nats-service:4222"
        - name: DB_HOST
          value: mariadb-service
        - name: DB_PORT
          value: "3306"
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: chat-db-credentials
              key: database
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: chat-db-credentials
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: chat-db-credentials
              key: password
        - name: DB_POOL_SIZE
          value: "5"
        startupProbe:
          httpGet:
            path: /api/livez
            port: http
          failureThreshold: 30
          periodSeconds: 2
        readinessProbe:
          httpGet:
            path: /api/ready
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /api/livez
            port: http
          initialDelaySeconds: 10
          periodSeconds: 20
          timeoutSeconds: 3
        lifecycle:
          preStop:
            exec:
              command: ["sh", "-c", "sleep 5"]
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 192Mi
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop: ["ALL"]
      # Spread replicas if the lab grows more app workers. ScheduleAnyway keeps
      # the demo working with the single role=chat worker used here.
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: chat-server
---
# 2.2 Chat Server Service (used by nginx)
apiVersion: v1
kind: Service
metadata:
  name: chat-server-service
spec:
  selector:
    app: chat-server
  ports:
  - name: http
    port: 8080
    targetPort: http
---
# 2.3 NATS event bus shared by every chat replica
# NATS is stateless and fixed on the control plane: it is not autoscaled, just
# like MariaDB, Prometheus, Grafana and nginx.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      nodeSelector:
        role: control-plane
      terminationGracePeriodSeconds: 10
      containers:
      - name: nats
        image: nats:2.10-alpine
        imagePullPolicy: IfNotPresent
        args: ["-m", "8222"]
        ports:
        - name: client
          containerPort: 4222
        - name: monitor
          containerPort: 8222
        readinessProbe:
          httpGet:
            path: /healthz
            port: monitor
          initialDelaySeconds: 2
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: monitor
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop: ["ALL"]
---
# 2.4 NATS Service (nats-service:4222)
apiVersion: v1
kind: Service
metadata:
  name: nats-service
spec:
  selector:
    app: nats
  ports:
  - name: client
    port: 4222
    targetPort: client
---
# 2.5 Keep at least one chat replica during voluntary disruptions
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: chat-server
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: chat-server
---
# 2.6 Pod autoscaling based on CPU requests
# metrics-server ships with k3s, so the HPA can read CPU without extra
# components. The app also exposes NATS/WebSocket metrics on :9091 for
# Prometheus, but CPU is the trigger used by this lab demo.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: chat-server
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: chat-server
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
---
# 3.1 Prometheus scraper
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
---
# 3.2 Prometheus Role Worker
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
- apiGroups: [""]
  resources:
  - nodes
  - nodes/proxy
  - services
  - endpoints
  - pods
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources:
  - configmaps
  verbs: ["get"]
- nonResourceURLs: ["/metrics"]
  verbs: ["get"]
---
# 3.3 Prometheus Binding for permissions
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: default
---
# 3.4 Prometheus Config, where to get info and how often
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'k3s-nodes'
        static_configs:
          - targets: ['192.168.56.10:6443', '192.168.56.11:9100', '192.168.56.12:9100', '192.168.56.13:9100', '192.168.56.14:9100']
      # Scrape pods that opt in with prometheus.io/scrape=true. The chat pods
      # expose /metrics on their dedicated port 9091.
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
---
# 3.5 Prometheus Worker itself
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      # Keep monitoring on its fixed worker so the autoscaled chat pods do not
      # compete with Prometheus.
      nodeSelector:
        role: grafana
      containers:
      - name: prometheus
        image: prom/prometheus:latest
        args:
        - "--config.file=/etc/prometheus/prometheus.yml"
        - "--storage.tsdb.path=/prometheus"
        - "--storage.tsdb.retention.time=2h"
        ports:
        - containerPort: 9090
        volumeMounts:
        - name: prometheus-config-volume
          mountPath: /etc/prometheus/
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 384Mi
      volumes:
      - name: prometheus-config-volume
        configMap:
          name: prometheus-config
---
# 3.6 Prometheus Service
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090

---
# 3.5 Prometheus Config for http api
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      access: proxy
      url: http://prometheus-service:9090
      isDefault: true
---
# 4.1 Grafana VolumePersistent
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
# 4.2 Grafana Deployment on Grafana Worker
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      nodeSelector:
        role: grafana
      containers:
      - name: grafana
        image: grafana/grafana:latest
        ports:
        - containerPort: 3000
        env:
        # Grafana builds redirects from root_url, so it must include the host
        # port that the browser uses (nginx is published on host port 8080).
        - name: GF_SERVER_ROOT_URL
          value: "http://localhost:8080/grafana/"
        - name: GF_SERVER_SERVE_FROM_SUB_PATH
          value: "true"
        volumeMounts:
        - name: grafana-storage
          mountPath: /var/lib/grafana
        - name: grafana-datasources-volume
          mountPath: /etc/grafana/provisioning/datasources/
      volumes:
      - name: grafana-storage
        persistentVolumeClaim:
          claimName: grafana-pvc
      - name: grafana-datasources-volume
        configMap:
          name: grafana-datasources
---
# 4.3 service to expose the 
apiVersion: v1
kind: Service
metadata:
  name: grafana-service
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
---
# 5. Nginx Deployment on Nginx Worker
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-router
  template:
    metadata:
      labels:
        app: nginx-router
    spec:
      nodeSelector:
        role: nginx
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
        volumeMounts:
        - name: config-volume
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
      volumes:
      - name: config-volume
        configMap:
          name: nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
spec:
  type: NodePort
  selector:
    app: nginx-router
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080