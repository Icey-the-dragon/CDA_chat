# Static hostPath PVs for the kubeadm lab. Unlike k3d/k3s, a plain kubeadm
# cluster has no default dynamic provisioner, so the PVCs from the shared
# manifests would stay Pending forever. Each PV is pinned to the node that
# already owns the corresponding workload.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: kubeadm-mariadb-data
spec:
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: default
    name: mariadb-data
  hostPath:
    path: /var/lib/kubeadm-data/mariadb-legacy
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: role
              operator: In
              values:
                - db
---
