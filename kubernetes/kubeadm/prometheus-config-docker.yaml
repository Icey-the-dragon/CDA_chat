# kubeadm Docker-provider override applied by scripts/kubeadm-up-docker.sh.
# On the isolated user-defined network Docker provides DNS by container name.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'kubeadm-nodes'
        static_configs:
          - targets:
            - 'kubeadm-docker-controlplane:6443'
            - 'kubeadm-docker-worker-infra:9100'
            - 'kubeadm-docker-worker-app:9100'
      # Scrape pods that opt in with prometheus.io/scrape=true. The chat pods
      # expose /metrics on their dedicated port 9091.
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            target_label: app
          - source_labels: [__meta_kubernetes_pod_name]
            regex: '.*-([^-]+)$'
            replacement: '$1'
            target_label: replica
