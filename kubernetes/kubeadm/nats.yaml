# kubeadm-only NATS cluster. The base manifest runs a single NATS pod on the
# control plane; that would make cross-replica chat depend on the master.
# This StatefulSet runs one server per worker and routes them together.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
data:
  nats.conf: |
    port: 4222
    cluster {
      name: cda-chat
      listen: 0.0.0.0:6222
      routes = [nats://nats-0.nats-headless.default.svc.cluster.local:6222, nats://nats-1.nats-headless.default.svc.cluster.local:6222]
    }
---
apiVersion: v1
kind: Service
metadata:
  name: nats-headless
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: nats
  ports:
  - name: client
    port: 4222
    targetPort: client
  - name: cluster
    port: 6222
    targetPort: cluster
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
spec:
  serviceName: nats-headless
  replicas: 2
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      nodeSelector:
        nats: enabled
      # One NATS server per worker: losing a worker must not take down the
      # whole event bus. The two workers are the only nats=enabled nodes.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values: [nats]
            topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 10
      containers:
      - name: nats
        image: nats:2.10-alpine
        imagePullPolicy: IfNotPresent
        args: ["-c", "/etc/nats/nats.conf"]
        ports:
        - name: client
          containerPort: 4222
        - name: cluster
          containerPort: 6222
        readinessProbe:
          tcpSocket:
            port: client
          initialDelaySeconds: 2
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: client
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: config
          mountPath: /etc/nats
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: nats-config
