# Upgrade WebSocket connections, keep normal HTTP requests working.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;

        # 1. Chat server: web UI + fallback for WebSocket paths without a slash
        location / {
            proxy_pass http://chat-server-service:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # 2. Chat Server REST API
        location /api/ {
            proxy_pass http://chat-server-service:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # 3. Chat Server WebSockets
        location /ws/ {
            proxy_pass http://chat-server-service:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # 4. Grafana Web UI Proxy
        # Preserve the host port when the browser omits the trailing slash.
        # $http_host includes the port (e.g. localhost:8080); nginx would
        # otherwise build an absolute redirect without it and drop to port 80.
        location = /grafana {
            return 301 $scheme://$http_host/grafana/;
        }

        # No trailing slash on proxy_pass: Grafana is configured with
        # serve_from_sub_path=true, so it must receive the /grafana/ prefix.
        location /grafana/ {
            proxy_pass http://grafana-service:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }