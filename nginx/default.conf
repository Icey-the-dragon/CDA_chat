server {
    listen 80;

    # Serve static web server files directly
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
    }

    # Route REST API and WebSockets to the chat server service
    location /api/ {
        proxy_pass http://chat-server-service:8080/;
    }

    location /ws/ {
        proxy_pass http://chat-server-service:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}