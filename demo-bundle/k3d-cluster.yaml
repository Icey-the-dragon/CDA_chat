# 3 nodes as Docker containers: 1 control-plane + 2 workers.
# k3s already bundles metrics-server, which the HPA needs.
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: cda-demo
# Pinned to the image included in images/k3s.tar, so the demo does not depend
# on whatever k3s version the installed k3d would pick by default.
image: rancher/k3s:v1.31.5-k3s1
servers: 1
agents: 2
ports:
  # Host 8080 -> nginx-free direct NodePort of the demo Service.
  - port: 8080:30080
    nodeFilters:
      - loadbalancer
options:
  k3d:
    wait: true
    timeout: "180s"
  k3s:
    extraArgs:
      # Traefik is not used; skipping it avoids an extra image pull.
      - arg: --disable=traefik
        nodeFilters:
          - server:*
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: true
