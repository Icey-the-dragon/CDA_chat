# Apply only when demonstrating automatic scaling:
#   kubectl apply -f manifests/load.yaml
#   watch kubectl get hpa,pods -l app=demo
#   kubectl delete job demo-load
apiVersion: batch/v1
kind: Job
metadata:
  name: demo-load
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: demo-load
    spec:
      restartPolicy: Never
      containers:
        - name: load
          image: cda-demo:latest
          imagePullPolicy: IfNotPresent
          command: ["node", "load.mjs"]
          env:
            - name: TARGET
              value: "http://demo/api/burn?ms=1200"
            - name: WORKERS
              value: "8"
            - name: DURATION_MS
              value: "120000"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
